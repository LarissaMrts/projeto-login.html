<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Meu Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Login</h1>
</header>

<main>  

    <section class="login-box">

      <form>
            <label>Nome de Usuário:</label>
            <input type="text" name="username">

            <br><br>

            <label>E-mail:</label>
            <input type="email" name="email">

            <br><br>

            <label>Senha:</label>
            <input type="password" name="password">

            <br><br>

            <label> Lembrar acesso: </label>
            <input type="checkbox" name="remember">

            <br><br>

            <a href="esqueceu-senha.html">Esqueceu sua senha?</a>

            <br><br>

            <a href="cadastro.html">Realizar cadastro.</a>
        
            <br><br>

            <button>Entrar</button>

        </form> 
    </section>
    
</main>

<footer>
    <p>Sistema de Login</p>
</footer>

</body>

</html>
